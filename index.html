<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d2f5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="TOP ROAD - 궁수 부대를 이끌고 숫자 게이트를 지나 적 대군과 보스를 무찌르는 3D 러너 게임">
<title>Top Road</title>
<link rel="preload" href="assets/fonts/LilitaOne.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/BlackHanSans-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f7bff'/%3E%3Cpath d='M18 46 L46 18 M40 18 h6 v6' stroke='%23ffd23f' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="ftext-layer"></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-left">
      <div class="avatar"><img id="avatar-img" alt=""></div>
      <div class="res">
        <div class="pill coin"><i class="ico-coin"></i><span id="coins">0</span></div>
        <div class="pill lvl"><span id="hud-level">LV 1</span></div>
      </div>
    </div>
    <div class="hud-center">
      <div class="progress"><div class="bar" id="progress-bar"></div><div class="knob" id="progress-knob"></div><div class="boss-ico">☠</div></div>
    </div>
    <button class="icon-btn" id="btn-pause" aria-label="일시정지">❚❚</button>
  </div>

  <div id="boss-bar" class="hidden">
    <div class="boss-name">철퇴 기사</div>
    <div class="boss-track"><div class="boss-fill" id="boss-fill"></div><span id="boss-hp">0</span></div>
  </div>

  <div id="caption"></div>
  <div id="banner"></div>
  <div id="hint" class="hidden"><div class="hand">👆</div><div class="hint-text">드래그해서 이동</div><div class="arrows"><span>◀</span><span>▶</span></div></div>

  <!-- 메인 메뉴 -->
  <div id="menu" class="screen hidden">
    <div class="logo">
      <div class="logo-top">TOP</div>
      <div class="logo-bottom">ROAD</div>
      <div class="logo-sub">궁수 대군 돌격전</div>
    </div>
    <div class="menu-bottom">
      <div class="menu-level" id="menu-level">레벨 1</div>
      <button class="btn big green" id="btn-play"><span>전투 시작</span></button>
      <div class="menu-row">
        <button class="btn blue" id="btn-shop"><span>🛠 강화</span></button>
        <button class="btn gray" id="btn-settings"><span>⚙ 설정</span></button>
      </div>
    </div>
  </div>

  <!-- 강화 상점 -->
  <div id="shop" class="screen panel-screen hidden">
    <div class="panel">
      <div class="panel-title">부대 강화</div>
      <div class="panel-coins"><i class="ico-coin"></i><span id="shop-coins">0</span></div>
      <div id="shop-list"></div>
      <button class="btn green" id="btn-shop-close"><span>확인</span></button>
    </div>
  </div>

  <!-- 설정 -->
  <div id="settings" class="screen panel-screen hidden">
    <div class="panel">
      <div class="panel-title">설정</div>
      <div class="setting-row"><span>효과음</span><button class="toggle" id="tg-sound"></button></div>
      <div class="setting-row"><span>배경음</span><button class="toggle" id="tg-music"></button></div>
      <div class="setting-row"><span>진동</span><button class="toggle" id="tg-vibrate"></button></div>
      <div class="setting-row"><span>그래픽</span>
        <div class="seg" id="seg-quality"><button data-q="0">낮음</button><button data-q="1">보통</button><button data-q="2">높음</button></div>
      </div>
      <div class="setting-row small"><button class="btn gray thin" id="btn-reset"><span>진행 초기화</span></button></div>
      <button class="btn green" id="btn-settings-close"><span>닫기</span></button>
    </div>
  </div>

  <!-- 일시정지 -->
  <div id="pause" class="screen panel-screen hidden">
    <div class="panel">
      <div class="panel-title">일시정지</div>
      <button class="btn green" id="btn-resume"><span>계속하기</span></button>
      <button class="btn blue" id="btn-restart"><span>다시 시작</span></button>
      <button class="btn gray" id="btn-home"><span>메인으로</span></button>
    </div>
  </div>

  <!-- 결과 -->
  <div id="result" class="screen panel-screen hidden">
    <div class="panel result-panel">
      <div class="result-title" id="result-title">승리!</div>
      <div class="stars" id="result-stars"><i></i><i></i><i></i></div>
      <div class="result-stats">
        <div><span>처치</span><b id="r-kills">0</b></div>
        <div><span>최대 병력</span><b id="r-max">0</b></div>
        <div><span>생존 병력</span><b id="r-count">0</b></div>
      </div>
      <div class="result-coins"><i class="ico-coin"></i>+<span id="r-coins">0</span></div>
      <button class="btn big green" id="btn-next"><span>다음 레벨</span></button>
      <div class="menu-row">
        <button class="btn blue" id="btn-r-shop"><span>🛠 강화</span></button>
        <button class="btn gray" id="btn-r-home"><span>메인</span></button>
      </div>
    </div>
  </div>

  <div id="loading">
    <div class="load-logo">TOP ROAD</div>
    <div class="load-bar"><div id="load-fill"></div></div>
  </div>
  <div id="error" class="hidden"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
